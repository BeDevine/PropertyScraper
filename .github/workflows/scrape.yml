name: Scrape Da Nang listings

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC — change or remove if you don't want it automatic yet
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python3 scraper.py --type land --max-price-usd 190000 --pages 15

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update listings data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

